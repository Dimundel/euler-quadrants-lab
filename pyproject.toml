[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-quadrants-lab"
version = "0.1.0"
description = "Задачи Римана для уравнений Эйлера: тема 11"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "networkx==3.7",
    "h5py==3.16.0",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "ipykernel==7.4.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "jupyterlab>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
